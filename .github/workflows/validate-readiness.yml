name: validate-m1-greybox
on:
  pull_request:
  push:
    branches:
      - main
      - discovery/migration-readiness
      - milestone/m1-greybox-foundation
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tools/validate_readiness.py
      - run: python tools/validate_android_export.py
      - run: python tools/validate_physical_android_preflight.py
      - name: Download official Godot 4.7.1
        run: |
          curl --fail --location --output godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import M1 project
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Run M1 automated tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_tests.gd
      - name: Run M1 keyboard regression
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_keyboard_regression.gd
      - name: Run M1 save-integrity stress tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_save_stress.gd
      - name: Run M1 save-feedback tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_save_feedback.gd
      - name: Run M1 visual-clarity tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_visual_clarity.gd
      - name: Run M2 progression and identity foundation
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_m2_foundation.gd
      - name: Run M2 leap traversal tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_leap_traversal.gd
      - name: Run M2 depth traversal tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_depth_traversal.gd
      - name: Run M2 menu lives and fairy tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_menu_lives_leaderboard.gd
      - name: Run M2 tongue interaction tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_tongue_interaction.gd
      - name: Run M2 boost locomotion tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_boost_locomotion.gd
      - name: Run M2 camera follow tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_camera_follow.gd
      - name: Run M2 locomotion animation coordinator tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_animation_coordinator.gd
      - name: Run M2 authored Fred rig tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_fred_rig.gd
      - name: Run M2 marsh visual, tongue assist, life stacking and touch tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_marsh_visual_uplift.gd
      - name: Run Android lifecycle and touch readiness tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_android_readiness.gd
      - name: Run lives, alternating routes, background and phone-layout tests
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path godot --script res://tests/run_lives_routes_phone_layout.gd
      - name: Verify exact Core agreement
        run: |
          test "$(cat godot/CORE_VERSION)" = "0.5.1"
          grep -q 'const CORE_VERSION := "0.5.1"' godot/addons/mobile_game_core/mobile_game_core.gd
          grep -q 'version="0.5.1"' godot/addons/mobile_game_core/plugin.cfg
          grep -q 'framework_version: String = "0.5.1"' godot/addons/mobile_game_core/configuration/game_config.gd
      - name: Verify clean patch formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD" -- . ':(exclude)godot/addons/mobile_game_core/**'
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...HEAD" -- . ':(exclude)godot/addons/mobile_game_core/**'
          else
            git diff --check HEAD^ -- . ':(exclude)godot/addons/mobile_game_core/**'
          fi
      - name: Reject common secret files
        run: test -z "$(find . -type f \( -name '*.pem' -o -name '*.p12' -o -name '*.jks' -o -name '.env' \) -print -quit)"
